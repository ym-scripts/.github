name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Tool version
      description: Output of `--version`, or the git tag/commit you ran
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: macOS 15, zsh, Node 22.11
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: Remove passwords, tokens and connection strings.
      render: shell
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Paste the full output.
    validations:
      required: true
